# TalentHub を hub-devkit とともに手元で動かす。
include:
  - path: .devkit/hub-files/docker-compose.devkit.yml
    project_directory: .

services:
  talenthub-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file:
      - .devkit/hub-files/platform.env
    environment:
      HUB_NAME: talenthub
      PORT: "8080"
    depends_on:
      devkit:
        condition: service_healthy
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    env_file:
      - .devkit/hub-files/platform-migrate.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
