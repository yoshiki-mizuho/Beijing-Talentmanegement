workflow:
  # MR の検証と、Web から明示的に起動したデモ DB の作業だけでパイプラインを作る。
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main" && $DEMO_DB_TASK'
    - when: never

# 社内ランナー（日報アプリと共用、スペックは高くない）の負荷を抑えるため、
# MR では verify の1ジョブだけを自動で動かす。e2e は手動。
stages:
  - verify
  - e2e
  - security
  - demo_db

default:
  # 社内のランナー（日報アプリと共用）で動かし、GitLab.com のクレジットを消費しない。
  tags: [$RUNNER_TAG]
  # 脆弱性の修正版（2026-10-21）に固定する。社内ランナーは取得済みの古いイメージを使い続けることがあるため
  image: node:24.22.1-bookworm-slim
  # 同じ MR に続けて push したら、古いパイプラインは止める。
  interruptible: true
  before_script:
    # npm のキャッシュはランナーのディスク（/cache）に置き、ジョブ間で使い回す。
    - npm ci --cache /cache/talenthub/npm --prefer-offline

variables:
  AST_ENABLE_MR_PIPELINES: "true"
  # 検証のジョブを動かすランナーのタグ。社内ランナーが不安定なときは、プロジェクトの CI/CD 変数で
  # RUNNER_TAG=saas-linux-small-amd64 を設定すると GitLab.com の共有ランナーで動く（クレジットを消費する）。
  RUNNER_TAG: on-premises-runner
  # デモ DB の作業（DEMO_DB_TASK）を動かすランナーのタグ。社内ネットワークは Neon への通信（5432番）が
  # 遮断されるため、初期値は GitLab.com の共有ランナー。社内ランナーで動かすときは on-premises-runner を渡す。
  DEMO_DB_RUNNER_TAG: saas-linux-small-amd64
  DATABASE_URL: "postgresql://talent:talent_password@postgres:5432/talentmanagement?schema=public"
  AUTH_SECRET: "ci-replace-with-a-long-random-secret"
  AUTH_URL: "http://localhost:3000"
  AUTH_TRUST_HOST: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # Chromium もランナーのディスクに置き、毎回ダウンロードしない。
  PLAYWRIGHT_BROWSERS_PATH: /cache/talenthub/ms-playwright

# アプリに関わるファイルが変わった MR だけで動かす（ドキュメントだけの MR では動かさない）。
.mr_app_changes:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &app_changes
        - src/**/*
        - prisma/**/*
        - e2e/**/*
        - ui-check/**/*
        - scripts/**/*
        - public/**/*
        - package.json
        - package-lock.json
        - .npmrc
        - "*.config.ts"
        - "*.config.mjs"
        - tsconfig.json
        - .gitlab-ci.yml

.postgres_service:
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_DB: talentmanagement
        POSTGRES_USER: talent
        POSTGRES_PASSWORD: talent_password

# lint、typecheck、単体テスト、migration の確認を1ジョブにまとめ、npm ci を1回で済ませる。
verify:
  extends: [.mr_app_changes, .postgres_service]
  stage: verify
  script:
    - npm run prisma:generate
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm exec prisma migrate deploy
    - npm run prisma:migrate:check

# 社内ランナーの負荷を抑えるため、e2e は必要なときだけ手動で動かす（MR の前に手元で全件流す）。
# ビルドもここで行う（build ジョブとの重複をなくした）。
e2e:
  extends: .postgres_service
  stage: e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *app_changes
      when: manual
      allow_failure: true
  variables:
    DEMO_ADMIN_PASSWORD: "ci-admin-password-47"
    DEMO_MANAGER_PASSWORD: "ci-manager-password-58"
    DEMO_MEMBER_PASSWORD: "ci-member-password-69"
    AI_API_BASE_URL: fake
  script:
    - npx playwright install --with-deps chromium
    - npm run prisma:generate
    - npm exec prisma migrate deploy
    - npm run db:seed
    - npm run build
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days

sast:
  stage: security

# The SAST analyzer image has no npm, so skip the default npm ci before_script.
semgrep-sast:
  inherit:
    default: false
  tags: [$RUNNER_TAG]
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - prisma/**/*
        - scripts/**/*
        - package.json
        - package-lock.json

demo_db_migrate:
  stage: demo_db
  tags: [$DEMO_DB_RUNNER_TAG]
  # DB の作業は途中で止めない。
  interruptible: false
  resource_group: demo_db
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main" && $DEMO_DB_TASK =~ /^(migrate|migrate_and_seed)$/'
  script:
    - |
      if [ -z "${NEON_DIRECT_URL:-}" ]; then
        echo "NEON_DIRECT_URL is not set."
        exit 1
      fi
    - export DATABASE_URL="${NEON_DIRECT_URL}?sslmode=require&connect_timeout=30"
    - npm exec prisma migrate status || true
    - npm exec prisma migrate deploy

demo_db_seed:
  stage: demo_db
  tags: [$DEMO_DB_RUNNER_TAG]
  interruptible: false
  resource_group: demo_db
  needs: [demo_db_migrate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main" && $DEMO_DB_TASK == "migrate_and_seed"'
  script:
    - |
      if [ -z "${NEON_DIRECT_URL:-}" ]; then
        echo "NEON_DIRECT_URL is not set."
        exit 1
      fi
      if [ -z "${DEMO_ADMIN_PASSWORD:-}" ]; then
        echo "DEMO_ADMIN_PASSWORD is not set."
        exit 1
      fi
      if [ -z "${DEMO_MANAGER_PASSWORD:-}" ]; then
        echo "DEMO_MANAGER_PASSWORD is not set."
        exit 1
      fi
      if [ -z "${DEMO_MEMBER_PASSWORD:-}" ]; then
        echo "DEMO_MEMBER_PASSWORD is not set."
        exit 1
      fi
    - export DATABASE_URL="${NEON_DIRECT_URL}?sslmode=require&connect_timeout=30"
    - npm run prisma:generate
    - npm run db:seed

include:
  - template: Security/SAST.gitlab-ci.yml
