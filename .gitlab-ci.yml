stages:
  - validate
  - test
  - build
  - security

default:
  image: node:24-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  DATABASE_URL: "postgresql://talent:talent_password@postgres:5432/talentmanagement?schema=public"
  AUTH_SECRET: "ci-replace-with-a-long-random-secret"
  AUTH_URL: "http://localhost:3000"
  AUTH_TRUST_HOST: "true"
  NEXT_TELEMETRY_DISABLED: "1"

lint:
  stage: validate
  script:
    - npm run lint

typecheck:
  stage: validate
  script:
    - npm run typecheck

migration_check:
  stage: validate
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_DB: talentmanagement
        POSTGRES_USER: talent
        POSTGRES_PASSWORD: talent_password
  script:
    - npm run prisma:generate
    - npx prisma migrate deploy
    - npm run prisma:migrate:check

test:
  stage: test
  script:
    - npm run test

build:
  stage: build
  script:
    - npm run build

sast:
  stage: security

include:
  - template: Security/SAST.gitlab-ci.yml
