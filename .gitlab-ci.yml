workflow:
  # MR の検証と Hub の配布作業でパイプラインを作る。
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$HUB_DEPLOY_ENABLED == "true" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "production")'
    - if: '$CI_PIPELINE_SOURCE == "web" && $HUB_BUILD_CHECK == "true"'
    - when: never

# 社内ランナー（日報アプリと共用、スペックは高くない）の負荷を抑えるため、
# MR では verify の1ジョブだけを自動で動かす。e2e は手動。
stages:
  - verify
  - e2e
  - security
  - build
  - deploy

default:
  # 社内のランナー（日報アプリと共用）で動かし、GitLab.com のクレジットを消費しない。
  tags: [$RUNNER_TAG]
  # 脆弱性の修正版（2026-10-21）に固定する。社内ランナーは取得済みの古いイメージを使い続けることがあるため
  image: node:24.22.1-bookworm-slim
  # 同じ MR に続けて push したら、古いパイプラインは止める。
  interruptible: true
  before_script:
    # npm のキャッシュはランナーのディスク（/cache）に置き、ジョブ間で使い回す。
    - npm ci --cache /cache/talenthub/npm --prefer-offline

variables:
  AST_ENABLE_MR_PIPELINES: "true"
  # 検証のジョブを動かすランナーのタグ。社内ランナーが不安定なときは、プロジェクトの CI/CD 変数で
  # RUNNER_TAG=saas-linux-small-amd64 を設定すると GitLab.com の共有ランナーで動く（クレジットを消費する）。
  RUNNER_TAG: on-premises-runner
  # 接続先の URL にパスワードを直接書かない（秘密情報の検査が反応するため）。値はテスト用の固定値。
  CI_DB_OWNER_PASSWORD: talent_password
  CI_APP_DATABASE_PASSWORD: "talent_app_password"
  DATABASE_URL: "postgresql://talent_app:${CI_APP_DATABASE_PASSWORD}@postgres:5432/talentmanagement?schema=public"
  MIGRATE_DATABASE_URL: "postgresql://talent:${CI_DB_OWNER_PASSWORD}@postgres:5432/talentmanagement?schema=public"
  NEXT_TELEMETRY_DISABLED: "1"
  # Chromium もランナーのディスクに置き、毎回ダウンロードしない。
  PLAYWRIGHT_BROWSERS_PATH: /cache/talenthub/ms-playwright

# アプリに関わるファイルが変わった MR だけで動かす（ドキュメントだけの MR では動かさない）。
.mr_app_changes:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &app_changes
        - src/**/*
        - prisma/**/*
        - e2e/**/*
        - scripts/**/*
        - package.json
        - package-lock.json
        - .npmrc
        - "*.config.ts"
        - "*.config.mjs"
        - tsconfig.json
        - .gitlab-ci.yml

.postgres_service:
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_DB: talentmanagement
        POSTGRES_USER: talent
        POSTGRES_PASSWORD: $CI_DB_OWNER_PASSWORD

# lint、typecheck、単体テスト、migration の確認を1ジョブにまとめ、npm ci を1回で済ませる。
verify:
  extends: [.mr_app_changes, .postgres_service]
  stage: verify
  script:
    - node scripts/create-ci-app-role.mjs
    - npm run prisma:generate
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm exec prisma migrate deploy
    - npm run test:db
    - npm run prisma:migrate:check

# 社内ランナーの負荷を抑えるため、e2e は必要なときだけ手動で動かす（MR の前に手元で全件流す）。
# ビルドもここで行う（build ジョブとの重複をなくした）。
e2e:
  extends: .postgres_service
  stage: e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *app_changes
      when: manual
      allow_failure: true
  variables:
    AI_API_BASE_URL: fake
  script:
    - npx playwright install --with-deps chromium
    - node scripts/create-ci-app-role.mjs
    - npm run prisma:generate
    - npm exec prisma migrate deploy
    - npm run db:seed
    - npm run build
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days

sast:
  stage: security

# The SAST analyzer image has no npm, so skip the default npm ci before_script.
semgrep-sast:
  inherit:
    default: false
  tags: [$RUNNER_TAG]
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - prisma/**/*
        - scripts/**/*
        - package.json
        - package-lock.json

# 本番で使う依存パッケージに、既知の高・重大の脆弱性がないかを確かめる。
# npm ci は不要（package-lock.json だけで判定できる）なので before_script を空にする。
dependency_audit:
  extends: .mr_app_changes
  stage: security
  before_script: []
  script:
    - npm audit --omit=dev --audit-level=high

# 秘密情報（API キー、パスワード、秘密鍵など）がコミットに混ざっていないかを確かめる。
# ドキュメントにも混ざりうるので、変更の種類を問わず MR ごとに動かす。
# テンプレートは見つけてもジョブを失敗させないので、報告に検出があれば失敗させて MR を止める。
secret_detection:
  stage: security
  inherit:
    default: false
  tags: [$RUNNER_TAG]
  interruptible: true
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - /analyzer run
    - |
      if tr -d ' \n\r\t' < gl-secret-detection-report.json | grep -q '"vulnerabilities":\[{'; then
        echo "秘密情報の可能性がある箇所が見つかりました。ジョブの成果物 gl-secret-detection-report.json を確認してください。"
        exit 1
      fi

build:web:
  extends: .hub_build_image
  stage: build
  variables:
    IMAGE_NAME: web
    CONTEXT: .
    DOCKERFILE: Dockerfile
  rules:
    - if: '$HUB_DEPLOY_ENABLED == "true" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "production")'
    - if: '$CI_PIPELINE_SOURCE == "web" && $HUB_BUILD_CHECK == "true"'

build:migrate:
  extends: .hub_build_image
  stage: build
  variables:
    IMAGE_NAME: migrate
    CONTEXT: .
    DOCKERFILE: Dockerfile.migrate
  rules:
    - if: '$HUB_DEPLOY_ENABLED == "true" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "production")'
    - if: '$CI_PIPELINE_SOURCE == "web" && $HUB_BUILD_CHECK == "true"'

deploy:dev:
  extends: .hub_update_tag
  stage: deploy
  needs: ["build:web", "build:migrate"]
  variables:
    VALUES_FILE: deploy/values-dev.yaml
    TAG_KEYS: "services.talenthub-web migrate"
    TARGET_BRANCH: main
  rules:
    - if: '$HUB_DEPLOY_ENABLED == "true" && $CI_COMMIT_BRANCH == "main"'

deploy:prod:
  extends: .hub_update_tag
  stage: deploy
  needs: ["build:web", "build:migrate"]
  variables:
    VALUES_FILE: deploy/values-prod.yaml
    TAG_KEYS: "services.talenthub-web migrate"
    TARGET_BRANCH: production
  rules:
    - if: '$HUB_DEPLOY_ENABLED == "true" && $CI_COMMIT_BRANCH == "production"'

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: chosen-ryoiki-group/hamburg/hub-platform
    ref: main
    file: /ci/hub/deploy.gitlab-ci.yml
