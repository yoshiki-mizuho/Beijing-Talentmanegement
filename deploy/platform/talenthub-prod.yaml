# このリポジトリでは使わない。H-7 で基盤リポジトリの deploy/applications/hubs/ に出す MR へ写す。
name: talenthub
env: prod
repoURL: https://gitlab.com/chosen-ryoiki-group/beijing/talentmanagement.git
targetRevision: production
valuesPath: deploy
autoSync: "false"
namespaceValues:
  routing:
    pathPrefix: talent
    routes:
      - path: /talent
        service: talenthub-web
        port: 8080
      - path: /api/talent/v1
        service: talenthub-web
        port: 8080
      - path: /talent/health
        service: talenthub-web
        port: 8080
        public: true
